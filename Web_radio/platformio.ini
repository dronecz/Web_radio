; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = small

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = boards/huge_app.csv
monitor_filters = esp32_exception_decoder
lib_deps = 
	lvgl/lvgl
	moononournation/GFX Library for Arduino@^1.6.2
	TFT_eSPI
	ESP32-audioI2S-master=https://github.com/schreibfaul1/ESP32-audioI2S/archive/master.zip
	tzapu/WiFiManager
build_flags =
    -D CORE_DEBUG_LEVEL=5                    ; 0 None, 1 Error, 2 Warn, 3 Info, 4 Debug, 5 Verbose
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D ARDUINO_RUNNING_CORE=1                ; Arduino Runs On Core (setup, loop)
    -D AUDIOTASK_CORE=0                      ; 0 or 1 - reads from the InBuffer, decodes and feeds I2S
    -D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
	-D LV_USE_PERF_MONITOR=0				; if 1 LVGL will show FPS & CPU usage
	-mfix-esp32-psram-cache-issue
    ;-D LV_USE_LOG=1
	-D'LV_CONF_PATH="${PROJECT_DIR}/lib/lv_conf.h"'  

[env:small]
build_flags = -Dsmall
	${env.build_flags}
build_src_filter = +<*> +<ui/small> -<ui/large>
lib_deps = 
	${env.lib_deps}

[env:large]
build_flags = -Dlarge
	${env.build_flags}

build_src_filter = +<*> +<ui/large> -<ui/small>
lib_deps = 
	${env.lib_deps} 
	
